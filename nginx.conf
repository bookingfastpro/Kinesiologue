server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    # Sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Supprime le slash final : une seule URL par page
    rewrite ^/(.+)/$ /$1 permanent;

    # Fichiers versionnés par Vite : cache 1 an
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Articles publiés après le build : rendu côté navigateur
    location /blog/ {
        try_files $uri $uri.html /app.html;
    }

    location = /admin {
        try_files /app.html =404;
    }

    # Pages pré-générées (/a-propos → a-propos.html), sinon vraie erreur 404
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
}
